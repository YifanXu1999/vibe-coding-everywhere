<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude-inspired Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="icon doc-icon" aria-hidden="true"></span>
        <div class="top-bar-text">
          <span class="chat-title" id="chat-title">Greeting</span>
          <span class="chat-subtitle">Today</span>
        </div>
        <span class="icon chevron-down" aria-hidden="true"></span>
      </div>
      <button type="button" class="btn-share" id="btn-share">Share</button>
    </header>

    <main class="chat-shell">
      <section class="chat-area" id="chat-area">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="typing-indicator" id="typing-indicator" hidden>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </section>

      <div class="render-preview-bar" id="render-preview-bar" hidden>
        <div class="render-preview-content">
          <p class="render-preview-row"><span class="render-preview-label">Command:</span> <code class="render-command" id="render-command"></code></p>
          <p class="render-preview-row"><span class="render-preview-label">URL:</span> <a class="render-url" id="render-url" target="_blank" rel="noopener noreferrer"></a></p>
          <button type="button" class="btn-run-render" id="btn-run-render">Run command &amp; open preview</button>
        </div>
      </div>

      <div class="permission-denial-container" id="permission-denial-container"></div>

      <form class="input-panel" id="input-form">
        <button type="button" class="btn-attach" id="btn-attach" aria-label="Attach">+</button>
        <input type="text" class="input-reply" id="prompt-input" placeholder="Reply..." autocomplete="off" />
        <div class="input-right">
          <div class="connection-status">
            <span class="status-dot disconnected" id="status-dot" aria-hidden="true"></span>
            <span class="status-label" id="status-label">Offline</span>
          </div>
          <label class="permission-select">
            <span class="permission-label">Permission</span>
            <select id="permission-mode">
              <option value="">Auto</option>
              <option value="ask">Ask each tool</option>
              <option value="auto">Auto approve</option>
            </select>
          </label>
          <div class="options-wrap">
            <button type="button" class="btn-options" id="btn-options" aria-label="Show Claude options">Options</button>
            <div class="options-popover" id="options-popover" hidden>
              <div class="options-popover-title">Claude command options</div>
              <dl class="options-list" id="options-list"></dl>
              <p class="options-hint" id="options-hint">—</p>
            </div>
          </div>
          <div class="model-selector" id="model-selector" role="button" tabindex="0">
            <span class="model-name">Sonnet 4.5</span>
            <span class="icon chevron-down small"></span>
          </div>
          <button type="submit" class="btn-send" id="send-btn" aria-label="Send">
            <span class="icon send-icon"></span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>

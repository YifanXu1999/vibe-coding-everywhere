<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Words</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.6);
    }

    p.subtitle {
      color: #a0c4ff;
      margin-bottom: 40px;
      font-size: 1rem;
    }

    #word-container {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      max-width: 700px;
      margin-bottom: 40px;
    }

    .word-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
      backdrop-filter: blur(6px);
    }

    .word-chip:hover {
      background: rgba(100, 200, 255, 0.25);
      border-color: #64c8ff;
      transform: scale(1.08);
      box-shadow: 0 0 14px rgba(100, 200, 255, 0.4);
    }

    .word-chip.selected {
      background: linear-gradient(135deg, #e040fb, #00b0ff);
      border-color: transparent;
      box-shadow: 0 0 18px rgba(224, 64, 251, 0.5);
      transform: scale(1.1);
    }

    button#generate-btn {
      background: linear-gradient(135deg, #e040fb, #00b0ff);
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1.1rem;
      color: #fff;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(0, 176, 255, 0.35);
    }

    button#generate-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(224, 64, 251, 0.5);
    }

    button#generate-btn:active {
      transform: scale(0.97);
    }

    #selected-display {
      margin-top: 30px;
      font-size: 1rem;
      color: #a0c4ff;
      min-height: 24px;
      text-align: center;
    }

    #selected-display span {
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>✨ Random Words</h1>
  <p class="subtitle">Click a word to highlight it, then generate new ones!</p>

  <div id="word-container"></div>

  <button id="generate-btn" onclick="generateWords()">🎲 Generate New Words</button>

  <div id="selected-display"></div>

  <script>
    const wordPool = [
      "aurora","cascade","nebula","velvet","quartz","eclipse","ember","solstice",
      "mirage","zephyr","labyrinth","vivid","cipher","gossamer","mosaic","pinnacle",
      "reverie","obsidian","lantern","horizon","drift","seraph","phantom","cobalt",
      "fable","glimmer","lullaby","tundra","vortex","cardinal","lunar","tempest",
      "crystal","haven","whisper","fractal","nomad","silver","spark","meridian",
      "bloom","wanderer","dusk","zenith","ritual","echo","saffron","mythic","prism",
      "solace","arctic","blossom","comet","delta","epoch","foliage","grace","hollow",
      "ivy","jewel","kestrel","lumen","marble","nocturne","opaque","petal","quest",
      "radiant","stone","twilight","umbra","vale","wave","xenon","yarrow","zeal"
    ];

    let selectedWords = new Set();

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateWords() {
      selectedWords.clear();
      updateSelectedDisplay();

      const words = shuffle(wordPool).slice(0, 12);
      const container = document.getElementById('word-container');
      container.innerHTML = '';

      words.forEach(word => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.textContent = word;
        chip.addEventListener('click', () => toggleWord(chip, word));
        container.appendChild(chip);
      });
    }

    function toggleWord(chip, word) {
      if (selectedWords.has(word)) {
        selectedWords.delete(word);
        chip.classList.remove('selected');
      } else {
        selectedWords.add(word);
        chip.classList.add('selected');
      }
      updateSelectedDisplay();
    }

    function updateSelectedDisplay() {
      const display = document.getElementById('selected-display');
      if (selectedWords.size === 0) {
        display.innerHTML = '';
      } else {
        const list = [...selectedWords].join(', ');
        display.innerHTML = `Selected: <span>${list}</span>`;
      }
    }

    // Generate on load
    generateWords();
  </script>
</body>
</html>
